<div class="modal-header">
    <h4 class="modal-title">{{ mode === 'add' ? 'Add Project' : 'Edit Project' }}</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="onCancel()"></button>
</div>

<form [formGroup]="projectForm" (ngSubmit)="onSubmit()">
    <div class="modal-body">
        <div class="container">
            <!-- First Row: Project Name & Project Type -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <div class="form-group">
                        <h5>Project Name</h5>
                        <input type="text" class="form-control" formControlName="project_name" placeholder="Project Name" />
                        <div *ngIf="projectForm.get('project_name')?.invalid && projectForm.get('project_name')?.touched" class="text-danger">
                            Name is required
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <h5>Project Type</h5>
                        <select class="form-control" formControlName="project_type">
                            <option value="" disabled>Select Project Type</option>
                            <option *ngFor="let type of projectTypes" [value]="type.pjTyCode">{{ type.pjTyName }}</option>
                        </select>
                        <div *ngIf="projectForm.get('project_type')?.invalid && projectForm.get('project_type')?.touched" class="text-danger">
                            Project type is required
                        </div>
                    </div>
                </div>
            </div>

            <!-- Second Row: Project Status (Half Width) -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <div class="form-group">
                        <h5>Project Status</h5>
                        <select class="form-control" formControlName="project_status">
                            <option value="" disabled>Select Project Status</option>
                            <option *ngFor="let status of projectStatuses" [value]="status.pjStName">{{ status.pjStName }}</option>
                        </select>
                        <div *ngIf="projectForm.get('project_status')?.invalid && projectForm.get('project_status')?.touched" class="text-danger">
                            Project status is required
                        </div>
                    </div>
                </div>
            </div>

            <!-- Third Row: Start Date & End Date -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <div class="form-group">
                        <h5>Start Date</h5>
                        <p-calendar 
                            formControlName="start_date" 
                            dateFormat="dd-mm-yy"
                            placeholder="Select Start Date"
                            [style]="{width: '100%'}"
                            [readonlyInput]="true">
                        </p-calendar>
                        <div *ngIf="projectForm.get('start_date')?.invalid && projectForm.get('start_date')?.touched" class="text-danger">
                            Start date is required
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <h5>End Date</h5>
                        <p-calendar 
                            formControlName="end_date" 
                            dateFormat="dd-mm-yy"
                            placeholder="Select End Date"
                            [style]="{width: '100%'}"
                            [readonlyInput]="true">
                        </p-calendar>
                        <div *ngIf="projectForm.get('end_date')?.invalid && projectForm.get('end_date')?.touched" class="text-danger">
                            End date is required
                        </div>
                    </div>
                </div>
            </div>

            <!-- Fourth Row: Project Price & Project Cost -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <div class="form-group">
                        <h5>Project Price</h5>
                        <input type="text" class="form-control" formControlName="project_price" placeholder="Project Price" maxlength="13" />
                        <div *ngIf="projectForm.get('project_price')?.invalid && projectForm.get('project_price')?.touched" class="text-danger">
                            Price is required
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <h5>Project Cost</h5>
                        <input type="text" class="form-control" formControlName="ps_cost" placeholder="Project Cost" maxlength="13" />
                        <div *ngIf="projectForm.get('ps_cost')?.invalid && projectForm.get('ps_cost')?.touched" class="text-danger">
                            Cost is required
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-footer">
        <button type="button" mat-button (click)="onCancel()" style="background-color: #7a7a7ac3; color: #ffffff; /* font-weight: bold; */ padding: 8px 16px; border-radius: 20px; display: flex; align-items: center; box-shadow: 0px 4px 6px rgba(0,
                        0, 0, 0.1); transition: box-shadow 0.3s ease;">
        Cancel
        </button>
        <button type="submit" mat-button style=" background-color: #4caf4fe1; color: #ffffff; /* font-weight: bold; */ padding: 8px 16px; border-radius: 20px; display: flex; align-items: center; box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1); transition:
                        box-shadow 0.3s ease;">
        {{ mode === 'add' ? 'Add' : 'Update' }}
        </button>
    </div>
</form>
